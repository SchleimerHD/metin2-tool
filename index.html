<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin2 Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 28px;
        }

        /* Bereich 1: Elemente */
        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .elements-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .element-btn {
            padding: 20px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .element-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .element-btn:active {
            transform: translateY(0);
        }

        .fire {
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            color: white;
        }

        .wind {
            background: linear-gradient(135deg, #4ecdc4, #44a080);
            color: white;
        }

        .water {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
        }

        .air {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
        }

        /* Bereich 2: Sequenz-Buttons */
        .sequence-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .sequence-btn {
            padding: 30px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #333;
        }

        .sequence-btn:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .sequence-btn:active {
            transform: scale(0.95);
        }

        /* Visualisierung der Sequenz */
        .sequence-display {
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 60px;
        }

        .sequence-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .sequence-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sequence-item {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .sequence-item .number {
            background: rgba(255, 255, 255, 0.3);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Button zum Zurücksetzen */
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .reset-btn {
            flex: 1;
            padding: 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }

        .clear-btn {
            flex: 1;
            padding: 12px;
            background: #fbbf24;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: #f59e0b;
            transform: translateY(-2px);
        }

        /* Bereich 3: Erweiterbar */
        .section-bottom {
            background: #f0f4ff;
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #667eea;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .elements-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .sequence-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 22px;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Metin2 Tool</h1>

        <!-- Bereich 1: Elemente -->
        <div class="section">
            <div class="section-title">Elemente</div>
            <div class="elements-grid">
                <button class="element-btn fire" onclick="addElement('🔥 Feuer')">🔥 Feuer</button>
                <button class="element-btn wind" onclick="addElement('💨 Wind')">💨 Wind</button>
                <button class="element-btn water" onclick="addElement('💧 Wasser')">💧 Wasser</button>
                <button class="element-btn air" onclick="addElement('⚡ Luft')">⚡ Luft</button>
            </div>
        </div>

        <!-- Bereich 2: Sequenz -->
        <div class="section">
            <div class="section-title">Sequenz</div>
            
            <div class="sequence-display">
                <div class="sequence-title">Eingabe-Reihenfolge:</div>
                <div class="sequence-items" id="sequenceDisplay"></div>
            </div>

            <div class="sequence-grid">
                <button class="sequence-btn" onclick="addSequence(1)">1</button>
                <button class="sequence-btn" onclick="addSequence(2)">2</button>
                <button class="sequence-btn" onclick="addSequence(3)">3</button>
                <button class="sequence-btn" onclick="addSequence(4)">4</button>
                <button class="sequence-btn" onclick="addSequence(5)">5</button>
                <button class="sequence-btn" onclick="addSequence(6)">6</button>
            </div>

            <div class="button-group">
                <button class="clear-btn" onclick="clearSequence()">Sequenz löschen</button>
                <button class="reset-btn" onclick="resetAll()">Alles zurücksetzen</button>
            </div>
        </div>

        <!-- Bereich 3: Erweiterbar -->
        <div class="section">
            <div class="section-bottom">
                📝 Bereich für weitere Funktionen - Bald verfügbar
            </div>
        </div>
    </div>

    <script>
        let sequence = [];
        let elements = [];
        let sequenceCounter = 0;

        function addSequence(number) {
            sequenceCounter++;
            sequence.push({
                number: number,
                position: sequenceCounter
            });
            updateDisplay();
        }

        function addElement(element) {
            elements.push({
                name: element,
                timestamp: new Date().toLocaleTimeString('de-DE')
            });
            console.log('Element hinzugefügt:', element);
        }

        function updateDisplay() {
            const displayDiv = document.getElementById('sequenceDisplay');
            
            if (sequence.length === 0) {
                displayDiv.innerHTML = '<span style="color: #999;">Keine Eingaben noch...</span>';
                return;
            }

            displayDiv.innerHTML = sequence.map((item, index) => `
                <div class="sequence-item">
                    <span>Button ${item.number}</span>
                    <div class="number">${item.position}</div>
                </div>
            `).join('');
        }

        function clearSequence() {
            sequence = [];
            sequenceCounter = 0;
            updateDisplay();
        }

        function resetAll() {
            sequence = [];
            elements = [];
            sequenceCounter = 0;
            updateDisplay();
            console.clear();
        }

        // Initiale Anzeige
        updateDisplay();
    </script>
</body>
</html>
